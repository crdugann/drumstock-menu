<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Accessible Drink Menu</title>
  <style>
    body {
      margin: 0;
      font-family: Tahoma, sans-serif;
      background-color: #eef2f7;
      display: grid;
      grid-template-areas:
        "header header header"
        "sidebar main main"
        "sidebar main main"
        "footer footer footer";
      grid-template-columns: 1fr 2fr;
      grid-template-rows: auto 1fr 1fr auto;
      gap: 10px;
      min-height: 100vh;
    }

    header {
      grid-area: header;
      background: #0077cc;
      color: white;
      text-align: center;
      padding: 20px;
      font-size: 1.8em;
    }

    aside {
      grid-area: sidebar;
      background: #cce5ff;
      padding: 20px;
    }

    main {
      grid-area: main;
      background: #ffffff;
      padding: 20px;
      border-radius: 10px;
    }

    footer {
      grid-area: footer;
      background: #333;
      color: white;
      text-align: center;
      padding: 15px;
    }

    nav {
      background-color: #222;
      padding: 10px;
      margin-bottom: 20px;
    }

    nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      padding: 0.5rem 1rem;
    }

    nav a:focus,
    nav a:hover {
      background-color: #444;
      outline: 2px solid #f90;
    }

    .menu-category {
      margin-bottom: 20px;
    }

    .menu-category h3 {
      color: #0077cc;
      margin-bottom: 10px;
    }

    .menu-item {
      margin-bottom: 10px;
    }

    .item-name {
      font-weight: bold;
    }

    .item-desc {
      display: block;
      margin: 4px 0;
    }

    .item-price {
      font-style: italic;
    }

    button {
      font-size: 1.2em;
      padding: 10px 20px;
      margin: 5px 0;
      background-color: #0077cc;
      color: white;
      border: none;
      border-radius: 6px;
    }
  </style>
</head>
<body>
<header>Drink Menu</header>
<aside>
<h2>Navigation</h2>
<nav aria-label="Main Menu">
<ul role="menubar">
<li role="none"><a href="#ciders" role="menuitem">Ciders</a></li>
<li role="none"><a href="#beers" role="menuitem">Beers</a></li>
<li role="none"><a href="#wine" role="menuitem">Wine</a></li>
<li role="none"><a href="#non-alcoholic" role="menuitem">Non-Alcoholic</a></li>
</ul>
</nav>
</aside>
<main>
<!-- Placeholder to indicate menu section will go here -->
<p>Insert your full drink menu with audio buttons here.</p>
</main>
<footer>© 2025 The Drink Company</footer>
<script>
  const menuLinks = document.querySelectorAll('nav a');
  menuLinks.forEach(link => {
    link.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown') {
        const next = link.parentElement.nextElementSibling?.querySelector('a');
        if (next) next.focus();
      }
      if (e.key === 'ArrowUp') {
        const prev = link.parentElement.previousElementSibling?.querySelector('a');
        if (prev) prev.focus();
      }
    });
  });

  function playAudio(path) {
    const audio = new Audio(path);
    audio.play();
  }
</script>
</body>
</html>
